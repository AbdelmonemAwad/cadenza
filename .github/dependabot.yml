# Dependency updates arrive grouped, one pull request per ecosystem, once a
# month. A bot's pull request is never merged as it stands: a new wheel or
# bundle is a shipped change, so it needs the VERSION bump the package job
# asks for, a changelog line and the licence-inventory row -- all taken onto
# `dev` by hand, after which the bot's pull request is closed as superseded
# (CONTRIBUTING.md, "Dependency updates").
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # A major of React, TypeScript or Vite is a deliberate upgrade with
      # its own pull request, not a monthly chore: the first grouped run
      # proposed React 19, TypeScript 7 and Vite 8 together and failed the
      # build. Minors and patches still arrive; so do security updates.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
