name: CI

on:
  push:
    branches: [main, develop]
  # Deliberately unfiltered. This used to read `branches: [main, develop]`,
  # which meant a pull request from one working branch to another ran no checks
  # at all -- and a pull request with no checks is worse than one with failing
  # checks, because the merge button is green either way and only the second
  # kind says so. Stacked pull requests are the normal shape of the work here,
  # so every one of them has to be verified on its own.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every push and PR. A leaked credential is unrecoverable once it is
  # public, so this is enforced mechanically rather than by review.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # scan full history, not just the tip commit

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan working tree
        run: ./gitleaks detect --source . --no-git --redact --exit-code 1

      - name: Scan commit history
        run: ./gitleaks detect --source . --redact --exit-code 1

  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # ffmpeg and fpcalc are what the engine shells out to; without them the
      # probe and fingerprint paths would be skipped rather than exercised.
      - name: Install audio tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Test
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # Catches missing translation keys: the Arabic catalogue is typed against
      # the English one, so a gap fails the build here.
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: cadenza/cadenza:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --entrypoint is deliberate: it tests the binaries directly and cannot
      # accidentally launch the long-running service stack, which would hang
      # the job until the workflow timeout.
      - name: Verify the runtime carries its tools
        timeout-minutes: 3
        run: |
          docker run --rm --entrypoint ffmpeg  cadenza/cadenza:ci -version | head -1
          docker run --rm --entrypoint ffprobe cadenza/cadenza:ci -version | head -1
          docker run --rm --entrypoint fpcalc  cadenza/cadenza:ci -version
          docker run --rm --entrypoint nginx   cadenza/cadenza:ci -v

      - name: Verify the application imports and builds its routes
        timeout-minutes: 3
        run: |
          docker run --rm -e CADENZA_CONFIG_DIR=/tmp/cfg \
            -e CADENZA_QUARANTINE_ROOT=/tmp/q --entrypoint python \
            cadenza/cadenza:ci -c "
          from app.main import create_app
          app = create_app()
          paths = sorted(r.path for r in app.routes)
          assert '/health' in paths, paths
          assert any(p.startswith('/api/v1/convert') for p in paths), paths
          print(f'app OK: {len(paths)} routes registered')
          "

      - name: Verify the UI bundle was baked into the image
        timeout-minutes: 2
        run: |
          docker run --rm --entrypoint sh cadenza/cadenza:ci -c \
            'test -s /app/www/index.html && ls /app/www/assets | head -5'

      # The container must run as a normal user on the NAS, never root, or it
      # writes root-owned files into the user's music share.
      #
      # This deliberately boots the real entrypoint instead of overriding it.
      # The previous version of this check ran `--entrypoint id`, which skipped
      # entrypoint.sh entirely and so could not fail for the reason that
      # actually mattered: a root-owned file the startup script tried to
      # rewrite made non-root startup impossible. See issue #10.
      - name: Verify the service actually starts as a non-root user
        timeout-minutes: 5
        run: |
          mkdir -p /tmp/cfg /tmp/q /tmp/music && chmod 777 /tmp/cfg /tmp/q /tmp/music
          docker run -d --name cadenza-nonroot \
            --user 1029:100 \
            -v /tmp/cfg:/config -v /tmp/q:/quarantine -v /tmp/music:/music \
            -p 18760:8760 cadenza/cadenza:ci

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18760/health >/dev/null 2>&1; then
              echo "service answered /health as uid $(docker exec cadenza-nonroot id -u)"
              curl -fsS http://127.0.0.1:18760/health; echo
              docker exec cadenza-nonroot id -u | grep -qx 1029
              docker rm -f cadenza-nonroot >/dev/null
              exit 0
            fi
            sleep 2
          done

          echo "::error::container did not become healthy as a non-root user"
          docker logs cadenza-nonroot
          docker rm -f cadenza-nonroot >/dev/null
          exit 1

  # Container Manager pulls the image from here. Without a published image the
  # compose file references a tag that exists only on the build machine, so a
  # Container Manager project would fail to start. See issue #2.
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [secrets, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cadenza
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    name: Synology .spk
    runs-on: ubuntu-latest
    needs: [docker]
    # Runs on pull requests too. The .spk is the artifact the user actually
    # installs, and this job is what checks its layout: checksums, executable
    # bits and CRLF line endings in the scripts DSM runs. Restricting it to
    # pushes meant a change that broke the package was only caught after it had
    # already landed on main.

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # setup-python gives an isolated interpreter; a bare `pip install` on the
      # runner's system Python fails with externally-managed-environment.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging prerequisites
        run: python -m pip install --upgrade pip pillow

      # The native payload ships the built UI, so it has to exist before the
      # package is assembled. build-native-payload.sh fails rather than
      # producing a package that serves a blank page.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend bundle
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      # The interpreter and the ffmpeg build are large and versioned, so they
      # are worth caching between runs. The key covers both, since either can
      # change independently.
      - name: Cache the downloaded runtime
        uses: actions/cache@v4
        with:
          path: build/cache
          key: native-runtime-${{ hashFiles('packaging/synology/build-native-payload.sh', 'backend/requirements.txt') }}

      # NATIVE=1 is the real package: interpreter, dependencies, ffmpeg and the
      # app. The payload build refuses to finish unless the staged tree can
      # actually import the application and every preset codec is present, so
      # this step failing means the package would not have worked on the NAS.
      - name: Build .spk (native runtime)
        run: NATIVE=1 bash packaging/synology/build-spk.sh

      # A .spk DSM cannot open is worse than no .spk, so check the archive
      # layout and the checksum the installer verifies.
      - name: Verify the package structure
        run: |
          SPK=$(ls dist/*.spk)
          echo "built: $SPK ($(du -h "$SPK" | cut -f1))"
          mkdir -p /tmp/spk && tar -xf "$SPK" -C /tmp/spk
          for required in INFO package.tgz scripts/start-stop-status scripts/postinst \
                          conf/privilege conf/resource ui/config PACKAGE_ICON.PNG; do
            test -e "/tmp/spk/$required" || { echo "MISSING from .spk: $required"; exit 1; }
            echo "  present: $required"
          done
          # DSM refuses to install if this checksum disagrees with package.tgz.
          declared=$(grep '^checksum=' /tmp/spk/INFO | cut -d'"' -f2)
          actual=$(md5sum /tmp/spk/package.tgz | cut -d' ' -f1)
          echo "  checksum declared=$declared actual=$actual"
          test "$declared" = "$actual" || { echo "checksum mismatch"; exit 1; }
          grep -q '^arch="x86_64"' /tmp/spk/INFO || { echo "wrong arch"; exit 1; }

          # DSM resolves dsmuidir and conf/resource's protocol-file against
          # target/ -- that is, against package.tgz. Checking the OUTER archive
          # for ui/config passed for months while target/ui did not exist at
          # all, so the desktop icon could never be registered. Check where DSM
          # actually looks.
          mkdir -p /tmp/payload && tar -xzf /tmp/spk/package.tgz -C /tmp/payload
          uidir=$(grep '^dsmuidir=' /tmp/spk/INFO | cut -d'"' -f2)
          test -f "/tmp/payload/${uidir}/config" || {
            echo "MISSING from package.tgz: ${uidir}/config (dsmuidir points here)"
            echo "payload contains:"; find /tmp/payload -maxdepth 2 | head -20; exit 1; }
          echo "  present in target/: ${uidir}/config"
          proto=$(python3 -c "import json;print(json.load(open('/tmp/spk/conf/resource'))['port-config']['protocol-file'])")
          test -f "/tmp/payload/${proto}" || {
            echo "MISSING from package.tgz: ${proto} (protocol-file points here)"; exit 1; }
          echo "  present in target/: ${proto}"
          python3 -c "import json;json.load(open('/tmp/payload/${uidir}/config'))"             || { echo "ui/config is not valid JSON"; exit 1; }

          # The runtime the package cannot start without. Each of these was
          # absent from the package for its whole life before the native build.
          for required in python/bin/python3 app/app/main.py www/index.html                           bin/ffmpeg bin/ffprobe bin/fpcalc; do
            test -e "/tmp/payload/${required}" || {
              echo "MISSING runtime component: ${required}"; exit 1; }
          done
          echo "  runtime present: interpreter, app, UI, ffmpeg, ffprobe, fpcalc"
          test -x /tmp/payload/python/bin/python3 || { echo "interpreter not executable"; exit 1; }

          # Boot the payload exactly as start-stop-status does. This is the
          # difference between "the archive has the right shape" and "the
          # service would actually come up on the NAS".
          PYTHONHOME=/tmp/payload/python           PYTHONPATH=/tmp/payload/app:/tmp/payload/lib           PYTHONNOUSERSITE=1           LD_LIBRARY_PATH=/tmp/payload/python/lib:/tmp/payload/ffmpeg-lib           CADENZA_CONFIG_DIR=$(mktemp -d) CADENZA_QUARANTINE_ROOT=$(mktemp -d)           CADENZA_WWW_DIR=/tmp/payload/www           /tmp/payload/python/bin/python3 -c "
          from app.main import create_app
          app = create_app()
          paths = {r.path for r in app.routes}
          assert '/health' in paths
          print(f'  payload boots: {len(paths)} routes')
          " || { echo "::error::the packaged payload cannot start"; exit 1; }
          # The control scripts must be executable and LF-terminated, or DSM
          # fails them with an opaque error at install time.
          for s in /tmp/spk/scripts/*; do
            if [ ! -x "$s" ]; then echo "not executable: $s"; exit 1; fi
            if grep -qU $'\r' "$s"; then echo "CRLF line endings in: $s"; exit 1; fi
          done
          echo "package structure OK"

      # The licence texts have to be inside the package, or it ships LGPL
      # binaries accompanied by nothing but this project's MIT licence.
      - name: Verify the redistributed binaries carry their licences
        run: |
          for lic in doc/licences/ffmpeg-LICENSE.txt doc/licences/fpcalc-LICENSE.md                      doc/licences/README.txt; do
            test -s "/tmp/payload/${lic}" || { echo "MISSING licence text: ${lic}"; exit 1; }
            echo "  present: ${lic}"
          done
          grep -q "LESSER GENERAL PUBLIC LICENSE" /tmp/payload/doc/licences/ffmpeg-LICENSE.txt             || { echo "the ffmpeg licence text is not an LGPL text"; exit 1; }
          # LGPLv3, not v2.1 -- BtbN builds with --enable-version3. Shipping the
          # wrong text is a notice defect, so the version is asserted here.
          grep -q "Version 3" /tmp/payload/doc/licences/ffmpeg-LICENSE.txt             || { echo "expected the LGPLv3 text from the lgpl-shared build"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: cadenza-spk
          path: dist/*.spk
          retention-days: 30

      # LGPL 2.1 s.4 does not accept a download link as source delivery, so the
      # corresponding source travels with the binaries it belongs to.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cadenza-thirdparty-source
          path: build/cache/sources/*
          retention-days: 90
          if-no-files-found: warn
